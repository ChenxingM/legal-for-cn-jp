# Save this file at .github/workflows/refresh-cn-laws.yml in your fork of the plugin.
# It will run weekly on Monday 03:00 UTC (12:00 JST), pull the latest core PRC
# statutes from flk.npc.gov.cn, and open a PR (or commit directly to a branch)
# with any changes.
#
# Why: corporate networks often block .cn domains. GitHub-hosted runners are
# in the US/EU and can reach flk.npc.gov.cn normally. Output is committed to
# this repo and pulled into the plugin via `git pull`, no .cn access needed
# on the user's side.

name: Refresh PRC core statutes

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: |
          python3 tooling/cn-law-refresh/scraper.py \
            --out-dir references/cn_laws/

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet references/cn_laws/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --name-only references/cn_laws/ | head -20
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(cn-laws): refresh from flk.npc.gov.cn'
          title: 'Weekly refresh: PRC core statutes'
          body: |
            Automated weekly refresh of the bundled PRC core statutes.

            Source: flk.npc.gov.cn (国家法律法规数据库)
            Scraper: tooling/cn-law-refresh/scraper.py
            Triggered: ${{ github.event_name }}

            **Review checklist:**
            - [ ] Spot-check 2-3 changed files for format integrity
            - [ ] Bump plugin version if any major rewrite landed
            - [ ] Repackage `.plugin` and publish a release if releasing
          branch: refresh-cn-laws/${{ github.run_number }}
          base: main
          delete-branch: true
