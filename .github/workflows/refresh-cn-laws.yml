# Weekly sync of LRB-sourced PRC core statutes from github.com/LawRefBook/Laws.
# Runs Monday 03:00 UTC (12:00 JST). Opens a PR if anything changed.
#
# Why: flk.npc.gov.cn rebuilt as a SPA in 2026, breaking the unofficial JSON
# API we previously scraped. LawRefBook handles that upstream complexity for us;
# we just `git clone` their corpus and cherry-pick the laws we want. Corporate
# networks that block .cn domains never need to be touched.

name: Refresh PRC core statutes

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: |
          python3 tooling/cn-law-refresh/scraper.py \
            --out-dir references/cn_laws/

      - name: Detect changes
        id: changes
        run: |
          # `git status --porcelain` catches both modified tracked files AND new untracked files.
          # `git diff --quiet` would miss new files (e.g., the first sync of a newly-added law).
          if [ -z "$(git status --porcelain references/cn_laws/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --porcelain references/cn_laws/ | head -30
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(cn-laws): sync from LawRefBook/Laws'
          title: 'Weekly sync: PRC core statutes (LawRefBook)'
          body: |
            Automated weekly sync of the LRB-sourced PRC core statutes.

            Upstream: github.com/LawRefBook/Laws (community-maintained corpus)
            Scraper:  tooling/cn-law-refresh/scraper.py
            Trigger:  ${{ github.event_name }}

            Owner-maintained laws (民法典 / 反不正当竞争法 / 网络安全法 / 仲裁法) are not in this diff — see `OWNER_MAINTAINED_LAWS` in scraper.py.

            **Review checklist:**
            - [ ] Spot-check 2-3 changed files for format integrity
            - [ ] If any LRB-sourced law shows regression vs a known recent amendment, move it into `OWNER_MAINTAINED_LAWS` and refresh from .docx instead
            - [ ] Bump plugin version if any major rewrite landed
          branch: refresh-cn-laws/${{ github.run_number }}
          base: main
          delete-branch: true
